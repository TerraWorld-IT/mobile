name: iOS LAN Test (TestFlight)

# ─────────────────────────────────────────────────────────────────────────────
# 로컬 LAN 서버(개발 PC)를 가리키는 네이티브 iOS 테스트 빌드 → TestFlight 업로드.
# release.yml(프로덕션, tag v* + https://terraworld.web-qplay.kr) 과 분리된 수동 테스트 경로.
#
# 앱은 원격 WebView 셸이라 server.url 이 빌드 타임에 baking 됨. 여기서는 dev 모드
# (NODE_ENV 미설정)로 cap sync 하여 MOBILE_SERVER_URL(기본=개발 PC LAN)을 baking.
# → 설치한 아이폰이 개발 PC 와 같은 WiFi 일 때만 동작(집 밖/셀룰러 X). Info.plist 의
#   NSAllowsLocalNetworking=true 로 사설망 cleartext 허용됨.
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   APPLE_API_KEY_ID         — App Store Connect API Key ID (10자)
#   APPLE_API_ISSUER_ID      — Issuer ID (UUID)
#   APPLE_API_KEY_P8_BASE64  — `base64 -w0 AuthKey_XXXX.p8` 결과 문자열
#   APPLE_TEAM_ID            — 프로젝트와 같은 SMF6T723XR
#   APPLE_DISTRIBUTION_CERT_P12_BASE64 / APPLE_DISTRIBUTION_CERT_PASSWORD
#   APPLE_PROVISIONING_PROFILE_BASE64 / APPLE_WIDGET_PROVISIONING_PROFILE_BASE64
#   ADMOB_IOS_APP_ID         — 선택. 미설정 시 Info.plist의 공식 테스트 App ID 유지
# 프로파일 발급·App Group 설정은 docs/terra-widget-runbook.md의 사람 작업 절 참조.
#
# 선행 조건: App Store Connect 에 bundle id `app.terraworld.mobile` 앱 레코드 존재 +
#            내부 테스터로 본인 Apple ID 등록. (docs 가이드 참조)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: '개발 PC LAN 서버 URL (WebView 가 로드할 주소)'
        required: true
        default: 'http://192.168.79.119:3000'

concurrency:
  group: ios-lan-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios-testflight:
    name: iOS LAN build → TestFlight
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # Apple 은 iOS 26 SDK(Xcode 26+) 이상으로 빌드된 앱만 App Store Connect 업로드 허용.
      # macos-latest 기본 Xcode 가 16.x 일 수 있어 명시적으로 26.x 를 선택한다.
      - name: Select Xcode 26 (iOS 26 SDK 필수)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "::error::Xcode 26 미설치 — 사용 가능 Xcode 목록:"; ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          echo "selected: $XC"
          xcodebuild -version

      # dev 모드(NODE_ENV 미설정) → capacitor.config.ts 가 isDev=true 로 판단하여
      # server.url = MOBILE_SERVER_URL, cleartext=true 로 baking.
      - name: Capacitor sync (LAN dev server)
        env:
          MOBILE_SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          echo "Baking server.url = $MOBILE_SERVER_URL"
          npx cap sync ios
          echo "--- generated capacitor.config.json (server) ---"
          node -e "const c=require('./ios/App/App/capacitor.config.json');console.log(JSON.stringify(c.server))" || true

      - name: Verify Apple upload and signing secrets
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for v in APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64 \
                   APPLE_DISTRIBUTION_CERT_P12_BASE64 APPLE_DISTRIBUTION_CERT_PASSWORD \
                   APPLE_PROVISIONING_PROFILE_BASE64 APPLE_WIDGET_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::GitHub Actions secret $v 누락"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::LAN TestFlight도 업로드 API 키·Distribution 인증서·App 및 Widget App Store 프로파일이 필요합니다. 두 프로파일에 group.app.terraworld.mobile을 연결하세요. docs/terra-widget-runbook.md의 사람 작업 1~5 참조."
            exit 1
          fi
          if [ "$APPLE_TEAM_ID" != 'SMF6T723XR' ]; then
            echo "::error::APPLE_TEAM_ID를 App·Extension의 팀 SMF6T723XR로 설정하세요"
            exit 1
          fi

      - name: Apply optional AdMob App ID
        env:
          ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
        run: |
          set -euo pipefail
          # LAN 개발 빌드는 운영 광고 설정 없이도 실행한다. 운영 ID 검사는 release.yml에서 수행한다.
          if [ -n "$ADMOB_IOS_APP_ID" ]; then
            /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $ADMOB_IOS_APP_ID" ios/App/App/Info.plist
          else
            echo "::notice::ADMOB_IOS_APP_ID 미설정 — Info.plist의 공식 테스트 App ID 유지"
          fi

      - name: Apply version (xcrun agvtool)
        working-directory: ios/App
        run: |
          xcrun agvtool new-marketing-version "0.0.1"
          # 빌드 번호는 매 업로드마다 증가해야 함 → run_number 사용
          xcrun agvtool new-version -all "${GITHUB_RUN_NUMBER}"

      - name: Decode Apple API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPLE_API_KEY_P8" | base64 -d > ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

      - name: Import distribution certificate and App/Widget profiles
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.APPLE_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # ── 임시 keychain 에 고정 Distribution 인증서 임포트 (재사용 — 매 실행 새 발급 금지) ──
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"   # 임시 keychain 잠금 암호(빌드 한정, 영속 아님)
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"   # 빌드 중 자동 잠금 방지
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          printf '%s' "$CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # codesign 이 프롬프트 없이 키에 접근하도록 partition list 설정
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"
          # xcodebuild 가 이 keychain 을 찾도록 검색 목록에 추가(login keychain 유지)
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # 인증서/개인키가 실제로 임포트됐는지 조기 검증 (잘못된 p12/비번을 archive 전에 잡는다)
          security find-identity -v -p codesigning "$KEYCHAIN"
          # App과 Extension은 서로 다른 App Store 프로파일을 사용한다.
          printf '%s' "$PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"
          printf '%s' "$WIDGET_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/widget.mobileprovision"
          for TARGET in app widget; do
            PROFILE="$RUNNER_TEMP/$TARGET.mobileprovision"
            security cms -D -i "$PROFILE" > "$RUNNER_TEMP/$TARGET-profile.plist"
            PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/$TARGET-profile.plist")"
            PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/$TARGET-profile.plist")"
            if [ "$TARGET" = app ]; then
              EXPECTED_NAME='TerraWorld App Store'
              EXPECTED_APP_ID='SMF6T723XR.app.terraworld.mobile'
              PROFILE_ENV='PROVISION_PROFILE_NAME'
            else
              EXPECTED_NAME='TerraWorld Widget App Store'
              EXPECTED_APP_ID='SMF6T723XR.app.terraworld.mobile.TerraWidgetExtension'
              PROFILE_ENV='WIDGET_PROVISION_PROFILE_NAME'
            fi
            # 잘못된 프로파일·App Group 누락은 archive 전에 차단한다. 값은 로그에 남기지 않는다.
            EXPECTED_NAME="$EXPECTED_NAME" EXPECTED_APP_ID="$EXPECTED_APP_ID" \
              python3 - "$RUNNER_TEMP/$TARGET-profile.plist" <<'PY'
          import datetime, os, plistlib, sys
          with open(sys.argv[1], 'rb') as f:
              p = plistlib.load(f)
          e = p.get('Entitlements', {})
          valid = (
              p.get('Name') == os.environ['EXPECTED_NAME']
              and e.get('application-identifier') == os.environ['EXPECTED_APP_ID']
              and p.get('TeamIdentifier') == ['SMF6T723XR']
              and 'group.app.terraworld.mobile' in e.get('com.apple.security.application-groups', [])
              and e.get('get-task-allow') is False
              and not p.get('ProvisionedDevices') and not p.get('ProvisionsAllDevices')
              and p.get('ExpirationDate', datetime.datetime.min) > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          )
          if not valid:
              sys.exit(f'::error::{os.environ["EXPECTED_NAME"]} 프로파일을 {os.environ["EXPECTED_APP_ID"]}용으로 발급하고 group.app.terraworld.mobile을 연결하세요. 팀·유효기간 및 docs/terra-widget-runbook.md의 사람 작업 1~5를 확인하세요')
          PY
            for PROFILE_DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                               "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$PROFILE_DIR"
              cp "$PROFILE" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
            done
            echo "$PROFILE_ENV=$PROFILE_NAME" >> "$GITHUB_ENV"
          done
          echo "::notice::App·Widget 서명 준비 완료"

      - name: Archive (xcodebuild)
        working-directory: ios/App
        run: |
          # Manual signing — 임포트한 고정 Distribution 인증서 + App Store profile 을 재사용한다.
          # -allowProvisioningUpdates 를 쓰지 않는다(그게 매 실행 인증서를 새로 발급해 상한을 소진했다).
          # signed archive 여야 embedded framework(GoogleMobileAds 등)도 서명됨 → altool 90035 회피.
          #
          # 서명 설정(CODE_SIGN_STYLE/IDENTITY/DEVELOPMENT_TEAM/PROVISIONING_PROFILE_SPECIFIER)은
          # 여기 CLI 로 넘기지 않는다 — xcodebuild 의 CLI build setting 은 *모든* 타겟에 적용되어
          # SPM 패키지 타겟(Capacitor 의 IONCameraLib 등)까지 프로파일을 강요하고
          # "does not support provisioning profiles" 로 archive 가 실패한다(v0.1.10 실측).
          # 대신 App·Extension 각 타깃의 Release 설정(project.pbxproj)에 개별 프로파일을 지정한다.
          # Capacitor 8 = SPM(비-CocoaPods) → App.xcworkspace 없음. -project App.xcodeproj.
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination 'generic/platform=iOS'

      - name: Verify archived widget and configured AdMob App ID
        run: |
          set -euo pipefail
          APP='ios/App/build/App.xcarchive/Products/Applications/App.app'
          if [ ! -f "$APP/PlugIns/TerraWidgetExtension.appex/Info.plist" ] \
             || [ ! -f "$APP/PlugIns/TerraWidgetExtension.appex/TerraWidgetExtension" ]; then
            echo "::error::archive에 TerraWidgetExtension.appex 누락"
            exit 1
          fi
          ACTUAL_ID="$(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "$APP/Info.plist")"
          EXPECTED_ID="$(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' ios/App/App/Info.plist)"
          if [ "$ACTUAL_ID" != "$EXPECTED_ID" ]; then
            echo "::error::archive의 AdMob App ID가 App/Info.plist 설정과 일치하지 않음"
            exit 1
          fi
          echo "::notice::Widget Extension 및 설정한 AdMob App ID 확인 완료"

      - name: Export IPA
        working-directory: ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # method=app-store + manual signing. 정적 부분은 quoted heredoc(리터럴), 동적 값(teamID/
          # profile 이름)은 PlistBuddy 로 삽입 — 문자열 연결 시 이름에 XML 특수문자(&,< 등)가 있으면
          # plist 가 깨지므로 PlistBuddy 로 안전하게 기록한다.
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
          </dict>
          </plist>
          PLIST
          PB=/usr/libexec/PlistBuddy
          "$PB" -c "Add :teamID string $APPLE_TEAM_ID" ExportOptions.plist
          "$PB" -c "Add :provisioningProfiles dict" ExportOptions.plist
          "$PB" -c "Add :provisioningProfiles:app.terraworld.mobile string $PROVISION_PROFILE_NAME" ExportOptions.plist
          "$PB" -c "Add :provisioningProfiles:app.terraworld.mobile.TerraWidgetExtension string $WIDGET_PROVISION_PROFILE_NAME" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight (xcrun altool)
        working-directory: ios/App
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          IPA=$(find build -name "*.ipa" | head -1)
          echo "Uploading $IPA to TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-lan-test-ipa
          path: ios/App/build/*.ipa
          if-no-files-found: ignore
          retention-days: 14
